appName: ai-mate-client-gateway
env: prod

http:
  addr: ":8080"
  readTimeout: 10s
  writeTimeout: 60s
  idleTimeout: 60s
  shutdownTimeout: 10s

log:
  level: info
  json: true

server:
  grpcTarget: "ai-mate-server:9090"
  timeout: 10s

observability:
  # 首次 v2 部署暂关链路追踪；网关 tracer 尚未支持 OpenObserve basic auth，
  # 后续补齐 otlpUsername/otlpPassword 注入后再开启。
  enabled: false
  otlpEndpoint: "http://openobserve:5080/api/default/v1/traces"
  sampleRatio: 1.0

